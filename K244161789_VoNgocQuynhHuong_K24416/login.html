<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniShop – Đăng nhập quản trị</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <h1><a href="index.html">🛒 MiniShop</a></h1>
  <nav><a href="index.html">Về trang bán hàng</a></nav>
</header>

<main class="page-narrow">
  <section class="form-box login-box">
    <h2>Đăng nhập quản trị</h2>
    <form id="loginForm">
      <div class="field">
        <label for="username">Tên đăng nhập</label>
        <input type="text" id="username" name="username" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <p id="loginError" class="error"></p>
      <button type="submit" class="btn primary">Đăng nhập</button>
    </form>
  </section>
</main>

<footer class="site-footer">
  © Sinh viên: Võ Ngọc Quỳnh Hương – Mã sinh viên: K244161789
</footer>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
