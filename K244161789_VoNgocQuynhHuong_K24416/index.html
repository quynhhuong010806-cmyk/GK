<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniShop – Danh sách sản phẩm</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <h1><a href="index.html">🛒 MiniShop</a></h1>
  <nav aria-label="Menu chính">
    <a href="index.html">Sản phẩm</a>
    <a href="checkout.html">Thanh toán</a>
    <a href="login.html">Quản trị</a>
    <button type="button" id="cartToggle" class="btn cart-btn">Giỏ hàng (<span id="cartCount">0</span>)</button>
  </nav>

  <!-- Câu 6: Mini-cart (position: absolute + z-index) -->
  <section id="miniCart" class="mini-cart" hidden aria-label="Giỏ hàng mini">
    <h2>Giỏ hàng</h2>
    <div id="miniCartBody"></div>
    <p class="mini-total">Tổng: <b id="miniCartTotal">$0.00</b></p>
    <a class="btn primary" href="checkout.html">Thanh toán</a>
  </section>
</header>

<main class="layout">

  <!-- Câu 2: Form tìm kiếm nâng cao ở thanh bên -->
  <aside class="sidebar" aria-label="Bộ lọc">

    <h2>Tìm kiếm nâng cao</h2>
    <form id="searchForm">
      <div class="field">
        <label for="keyword">Từ khóa</label>
        <input type="text" id="keyword" name="keyword" placeholder="Tên sản phẩm"
               minlength="2" maxlength="50" pattern="[\p{L}0-9 '\-]+" title="Chỉ gồm chữ, số, khoảng trắng">
      </div>

      <fieldset>
        <legend>Khoảng giá ($)</legend>
        <input type="number" id="minPrice" name="minPrice" placeholder="Từ" min="0" max="10000" step="0.01">
        <input type="number" id="maxPrice" name="maxPrice" placeholder="Đến" min="0" max="10000" step="0.01">
      </fieldset>

      <fieldset>
        <legend>Màu sắc</legend>
        <label><input type="checkbox" name="color" value="Đen"> Đen</label>
        <label><input type="checkbox" name="color" value="Trắng"> Trắng</label>
        <label><input type="checkbox" name="color" value="Đỏ"> Đỏ</label>
        <label><input type="checkbox" name="color" value="Xanh"> Xanh</label>
      </fieldset>

      <div class="field">
        <label for="ratingRange">Rating tối thiểu: <output id="ratingOut">0</output> ★</label>
        <input type="range" id="ratingRange" name="rating" min="0" max="5" step="0.5" value="0">
      </div>

      <div class="field">
        <label for="categorySelect">Danh mục</label>
        <select id="categorySelect" name="category" required>
          <option value="">Tất cả danh mục</option>
        </select>

      </div>

      <div class="form-actions">
        <button type="submit" class="btn primary">Tìm kiếm</button>
        <button type="reset" class="btn">Nhập lại</button>
      </div>
    </form>
  </aside>

  <section class="content" aria-labelledby="listTitle">
    <h2 id="listTitle">Danh sách sản phẩm</h2>
    <p id="resultInfo" class="muted"></p>
    <!-- Câu 3: CSS Grid. Mỗi sản phẩm là một <article> -->
    <div id="productGrid" class="grid"></div>
  </section>
</main>

<dialog id="quickView">
  <div id="quickBody"></div>
  <form method="dialog"><button class="btn">Đóng</button></form>
</dialog>

<dialog id="ratingDialog">
  <div id="ratingBody"></div>
  <form method="dialog"><button class="btn">Đóng</button></form>
</dialog>

<footer class="site-footer">
  © Sinh viên: Võ Ngọc Quỳnh Hương – Mã sinh viên: K244161789
</footer>

<script src="js/data.js"></script>

<script src="js/reviews.js"></script>
<script src="js/cart.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
