<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Tạo products.xml</title>
  <style>
    body{font-family:Arial;max-width:900px;margin:30px auto;padding:0 16px}
    textarea{width:100%;height:320px;margin-top:12px;font-family:monospace}
    button{padding:10px 18px;margin-right:8px;cursor:pointer}
  </style>
</head>
<body>
  <h2>Câu 1 – Đọc API fakestoreapi, bổ sung màu sắc + tồn kho, xuất products.xml</h2>
  <button id="btnBuild">1. Lấy dữ liệu &amp; tạo XML</button>
  <button id="btnDownload" disabled>2. Tải products.xml</button>
  <p id="msg"></p>
  <textarea id="out" readonly></textarea>

<script>
const COLORS = ["Đen", "Trắng", "Đỏ", "Xanh"];
const CLOTHES = ["men's clothing", "women's clothing"];
let xmlString = "";

const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr, n) => [...arr].sort(() => Math.random() - 0.5).slice(0, n);

document.getElementById("btnBuild").addEventListener("click", async () => {
  const msg = document.getElementById("msg");
  msg.textContent = "Đang tải dữ liệu...";
  try {
    const res = await fetch("https://fakestoreapi.com/products");
    const list = await res.json();


    // Dùng mô hình DOM để dựng tài liệu XML
    const doc = document.implementation.createDocument("", "products", null);
    const root = doc.documentElement;

    list.forEach(p => {
      const el = doc.createElement("product");
      el.setAttribute("id", p.id);

      const add = (parent, tag, val) => {
        const c = doc.createElement(tag);
        c.textContent = val;
        parent.appendChild(c);
        return c;
      };

      add(el, "title", p.title);
      add(el, "price", p.price);
      add(el, "category", p.category);
      add(el, "description", p.description);
      add(el, "image", p.image);

      // Bổ sung: màu sắc
      const colors = add(el, "colors", "");
      pick(COLORS, rand(2, 4)).forEach(c => add(colors, "color", c));

      // Bổ sung: kích cỡ (quần áo có S/M/L, còn lại là Free)
      const sizes = add(el, "sizes", "");
      (CLOTHES.includes(p.category) ? ["S", "M", "L"] : ["Free"])
        .forEach(s => add(sizes, "size", s));

      // Bổ sung: tồn kho

      add(el, "stock", rand(5, 50));

      root.appendChild(el);
    });

    xmlString = '<?xml version="1.0" encoding="UTF-8"?>\n' +
                new XMLSerializer().serializeToString(doc);
    document.getElementById("out").value = xmlString;
    document.getElementById("btnDownload").disabled = false;
    msg.textContent = `Đã tạo ${list.length} sản phẩm. Hãy tải file và lưu vào data/products.xml`;
  } catch (err) {
    msg.textContent = "Lỗi: " + err.message;
  }
});

document.getElementById("btnDownload").addEventListener("click", () => {
  const blob = new Blob([xmlString], { type: "application/xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "products.xml";
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
